name: livesync-couchdb

services:
  couchdb:
    image: couchdb:3.5.3
    container_name: livesync-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env or Coolify Environment Variables}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env or Coolify Environment Variables}
    volumes:
      - couchdb-data:/opt/couchdb/data
      # The image entrypoint chmods configuration files; keep this bind mount writable.
      - ./couchdb/livesync.ini:/opt/couchdb/etc/local.ini
    ports:
      - "127.0.0.1:${COUCHDB_PORT:-15984}:5984"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 4 --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}"
          http://127.0.0.1:5984/_up | grep -q '"status":"ok"'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  couchdb-init:
    image: couchdb:3.5.3
    restart: on-failure
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env or Coolify Environment Variables}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env or Coolify Environment Variables}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE:-obsidiannotes}
    volumes:
      - ./scripts/init-couchdb.sh:/usr/local/bin/init-couchdb.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-couchdb.sh"]

  caddy:
    image: caddy:2.11.9-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      COUCHDB_DOMAIN: ${COUCHDB_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      couchdb:
        condition: service_healthy

  coolify-gateway:
    image: caddy:2.11.9-alpine
    profiles: [coolify]
    restart: unless-stopped
    volumes:
      - ./Caddyfile.coolify:/etc/caddy/Caddyfile:ro
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb-data:
    external: ${COUCHDB_VOLUME_EXTERNAL:-false}
    name: ${COUCHDB_VOLUME_NAME:-livesync-couchdb-data}
  caddy-data:
  caddy-config:
